name: VS Code extension release

# Packages the extension as a VSIX on every pull request that touches it, and
# publishes to the VS Code Marketplace and Open VSX only when an extension tag
# is pushed. Extension tags look like `ext-v1.0.0`. They start with `e`, so they
# never match release.yml's `v*.*.*` npm trigger, and npm tags never match here.

on:
  pull_request:
    paths: ["apps/vscode/**", "packages/contracts/**", "pnpm-lock.yaml", ".github/workflows/vscode-release.yml"]
  push:
    tags: ['ext-v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          # This pinned setup-node v4 restores a cache only when the cache input is set.
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./apps/vscode/package.json').version")"
          if [ "$TAG" != "ext-v$version" ]; then
            echo "Tag $TAG does not match apps/vscode/package.json version $version" >&2
            exit 1
          fi
      - run: pnpm --filter ./apps/vscode build
      - name: Package VSIX
        run: pnpm --filter ./apps/vscode exec vsce package --no-dependencies -o blockbase.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockbase-vsix
          path: apps/vscode/blockbase.vsix
          if-no-files-found: error

  publish:
    name: publish to VS Code Marketplace and Open VSX
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          # This pinned setup-node v4 restores a cache only when the cache input is set.
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blockbase-vsix
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm --filter ./apps/vscode exec vsce publish --packagePath "$GITHUB_WORKSPACE/blockbase.vsix"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@0 publish blockbase.vsix
