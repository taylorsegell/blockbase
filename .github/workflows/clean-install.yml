name: Blockbase clean install and release gates

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install and validate plugin in an isolated home
        shell: bash
        run: |
          agent_home="$(mktemp -d)"
          node packages/cli/dist/index.js agent install --provider codex --scope global --home "$agent_home" --no-setup --json
          node packages/cli/dist/index.js agent check --provider codex --scope global --home "$agent_home" --json
          catalog_root="$(mktemp -d)"
          node packages/cli/dist/index.js catalog rebuild --catalog "$catalog_root" --json
          node packages/cli/dist/index.js catalog validate --catalog tests/fixtures/legacy-catalog/valid --json
      - name: Create a catalog with setup, without a login service
        shell: bash
        run: |
          blocks_home="$(mktemp -d)/blocks"
          export BLOCKBASE_HOME="$blocks_home"
          node packages/cli/dist/index.js setup --no-service --json | tee setup.json
          node -e 'const r = JSON.parse(require("fs").readFileSync("setup.json", "utf8")); if (r.data.catalog !== "created") { console.error("expected catalog created, got " + r.data.catalog); process.exit(1); }'
          node packages/cli/dist/index.js doctor --json
      - run: pnpm test
      - run: pnpm run drift:check
      - run: pnpm run regression:matrix
      - run: pnpm run benchmark
