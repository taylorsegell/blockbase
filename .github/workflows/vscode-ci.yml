name: VS Code extension

on:
  push:
    branches: [main]
    paths: ["apps/vscode/**", "packages/contracts/**", "pnpm-lock.yaml", ".github/workflows/vscode-ci.yml"]
  pull_request:
    paths: ["apps/vscode/**", "packages/contracts/**", "pnpm-lock.yaml", ".github/workflows/vscode-ci.yml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: build, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/vscode typecheck
      - run: pnpm --filter ./apps/vscode build
      - run: pnpm --filter ./apps/vscode test
