name: VS Code extension

on:
  push:
    branches: [main]
    paths: ["apps/vscode/**", "packages/contracts/**", "pnpm-lock.yaml", ".github/workflows/vscode-ci.yml"]
  pull_request:
    paths: ["apps/vscode/**", "packages/contracts/**", "pnpm-lock.yaml", ".github/workflows/vscode-ci.yml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: build, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/vscode typecheck
      - run: pnpm --filter ./apps/vscode build
      - run: pnpm --filter ./apps/vscode test
