<!doctype html>
<html lang="en" class="dark" data-theme="blocks-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocks preview</title>
    <link rel="icon" type="image/svg+xml" href="/src/blockbase-logo.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('blocks-preview-theme') || 'blocks-dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', /-dark$/.test(theme));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
